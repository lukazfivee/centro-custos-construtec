<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#021D26">
  <title>Centro de Custos — Teste ChatGPT P2</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#021d26}
    iframe{display:block;width:100%;height:100%;border:0;background:#f2f6f7}
    .status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui,sans-serif;letter-spacing:.02em}
  </style>
</head>
<body>
  <div id="status" class="status">Carregando a versão de teste P2…</div>
  <iframe id="app-frame" title="Centro de Custos Construtec" src="/"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('app-frame');
      const status = document.getElementById('status');
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc || doc.getElementById('chatgpt-p1-script')) return;

          const p1css = doc.createElement('link');
          p1css.id = 'chatgpt-p1-style';
          p1css.rel = 'stylesheet';
          p1css.href = '/chatgpt-p1.css?v=2';
          doc.head.appendChild(p1css);

          const p2css = doc.createElement('link');
          p2css.id = 'chatgpt-p2-style';
          p2css.rel = 'stylesheet';
          p2css.href = '/chatgpt-p2.css?v=2';
          doc.head.appendChild(p2css);

          const p1 = doc.createElement('script');
          p1.id = 'chatgpt-p1-script';
          p1.src = '/chatgpt-p1.js?v=2';
          p1.addEventListener('load', () => {
            const p2 = doc.createElement('script');
            p2.id = 'chatgpt-p2-script';
            p2.src = '/chatgpt-p2.js?v=2';
            p2.addEventListener('load', () => { status.style.display = 'none'; });
            p2.addEventListener('error', () => { status.textContent = 'Não foi possível carregar as melhorias P2.'; });
            doc.body.appendChild(p2);
          });
          p1.addEventListener('error', () => { status.textContent = 'Não foi possível carregar as melhorias P1.'; });
          doc.body.appendChild(p1);
        } catch (error) {
          status.textContent = `Falha ao abrir a versão de teste: ${error.message}`;
        }
      });
    })();
  </script>
</body>
</html>
