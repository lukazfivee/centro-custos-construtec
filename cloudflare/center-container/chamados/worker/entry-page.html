<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="chamados-origin" content="__CHAMADOS_ORIGIN__">
  <title>Entrar no Chamados · Suíte Construtec</title>
  <style nonce="__CSP_NONCE__">
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183b44;background:#f4f7f7;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}
    main{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.07em;font-weight:700;color:#234852;margin-bottom:28px}
    .mark{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;background:#123f49;color:#fff;font-size:24px;letter-spacing:0}
    article{background:#fff;border:1px solid #dde7e9;border-radius:18px;padding:32px;box-shadow:0 8px 40px #153a4409}
    .eyebrow{color:#277b7c;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:29px;line-height:1.18;letter-spacing:-.035em;margin:10px 0 14px}
    p{line-height:1.6;font-size:14px;color:#59717a;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}
    input{width:100%;border:1px solid #bbced2;border-radius:8px;padding:12px;font:inherit;background:#fff;color:#173b44}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #39aaaa66;outline-offset:3px}
    button{width:100%;border:0;border-radius:8px;padding:13px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;background:#14666b;color:#fff;margin-top:22px}
    button:disabled{opacity:.55;cursor:wait}button.secondary{color:#155d63;background:#e7f2f1;margin:0 0 18px}
    .divider{height:1px;background:#e4eded;margin:6px 0 22px}.links{display:flex;justify-content:space-between;gap:20px;margin-top:21px;font-size:12px}
    a{color:#296e75;text-decoration:none}a:hover{text-decoration:underline}#status{margin:18px 0 0;min-height:20px;font-size:13px;color:#973d37;line-height:1.55}
    footer{font-size:12px;line-height:1.6;color:#70858c;margin-top:20px;text-align:center}noscript{display:block;color:#973d37}
    [hidden]{display:none!important}@media(max-width:480px){body{padding:20px}article{padding:25px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">C</span>SUÍTE CONSTRUTEC</div>
    <article>
      <div class="eyebrow">Chamados e manutenção</div>
      <h1>Entre com sua conta da Suíte.</h1>
      <p>Use a conta central liberada para o Chamados. O acesso às empresas e atividades segue as permissões da sua conta.</p>
      <button id="continue" class="secondary" type="button" hidden>Continuar com a sessão da Suíte</button>
      <div id="session-divider" class="divider" hidden></div>
      <form id="login" action="/v1/auth/login" method="post">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">Entrar no Chamados</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <noscript>Ative o JavaScript para entrar pela autenticação central da Suíte.</noscript>
      <nav class="links" aria-label="Ajuda para entrar">
        <a href="/redefinir-senha">Esqueci minha senha</a>
        <a href="/suite/">Voltar à Suíte</a>
      </nav>
    </article>
    <footer>Contas corporativas e de clientes precisam de acesso autorizado ao módulo.</footer>
  </main>
  <script src="/chamados/entrar.js" defer></script>
</body>
</html>
