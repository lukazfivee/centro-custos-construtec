name: Atualizar lock de dependencias

on:
  push:
    branches:
      - 'chatgpt/p5-p8-suite-final'
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          ref: chatgpt/p5-p8-suite-final

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Atualizar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validar lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Salvar lockfile atualizado
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json ja esta atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: atualiza lockfile apos upgrade seguro'
          git push origin HEAD:chatgpt/p5-p8-suite-final
